name: Deploy web app to GitHub Pages

# Builds the browser (WebHID/WASM) front-end with Dioxus (dx) and publishes it
# to GitHub Pages. Runs on push to the public branch, or on demand.
on:
  push:
    branches: [dual-stack] # the public-facing branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI (dx)
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y dioxus-cli@0.7.9

      # WebHID's web-sys bindings are unstable-gated; the repo .cargo/config.toml
      # already sets --cfg=web_sys_unstable_apis for the wasm target.

      - name: Build Tailwind CSS (downloads the pinned v3 binary if absent)
        run: ./xap-ui/build-css.sh

      # GitHub project pages serve under /<repo>/, so the web build needs that
      # base path. dx reads it from Dioxus.toml's [web.app] base_path; inject the
      # repo name at build time so local dev (no base_path) is unaffected.
      - name: Set the Pages base path
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          printf '\nbase_path = "%s"\n' "$REPO" >> xap-ui/Dioxus.toml

      - name: Build the web app (release)
        working-directory: xap-ui
        run: dx build --platform web --release

      # NOTE (verify on first publish): confirm the dx web output directory. For
      # dx 0.7 it is typically target/dx/xap-ui/release/web/public.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/xap-ui/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
