name: Build desktop app

# Bundles the native desktop app (Dioxus Desktop / wry + hidapi) for Linux and
# macOS and uploads the artifacts.
on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Linux needs the wry/GTK stack; macOS uses the built-in WebKit (no deps).
      - name: Install Linux system dependencies (wry/GTK + libxdo + hidapi)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libudev-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI (dx)
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y dioxus-cli@0.7.9

      - name: Build Tailwind CSS (downloads the pinned v3 binary if absent)
        run: ./xap-ui/build-css.sh

      - name: Bundle the desktop app (release)
        working-directory: xap-ui
        run: dx bundle --platform desktop --release

      # NOTE (verify on first publish): confirm the dx desktop bundle output
      # directory; for dx 0.7 it is under target/dx/xap-ui/release/.
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: xap-ui-${{ runner.os }}
          path: target/dx/xap-ui/release/
          if-no-files-found: error
