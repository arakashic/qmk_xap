[package]
name = "xap-ui"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
# Local-time display for broadcast timestamps. Default features keep
# `wasmbind`, which makes chrono::Local work on wasm via js-sys.
chrono = "0.4"
async-trait = "0.1"
futures = "0.3"
log = "0.4"
# `js` only affects wasm targets (gates uuid's wasm-bindgen RNG); harmless on native.
uuid = { version = "1.8", features = ["serde", "v4", "js"] }
xap-core = { path = "../xap-core" }
xap-specs = { path = "../xap-specs" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hidapi = "2.6"
env_logger = "0.11"
pollster = "0.4"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
  "Hid", "HidDevice", "HidDeviceRequestOptions", "HidDeviceFilter",
  "HidInputReportEvent", "HidConnectionEvent", "HidCollectionInfo",
  "EventTarget", "Navigator", "Window", "console", "Element", "DomRect", "Clipboard",
] }
